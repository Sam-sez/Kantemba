name: kantemba
description: Shop management app for Zambian SMEs — cash book, point-of-sale, and inventory tracker in one.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.9.0
  mobile_scanner: ^5.0.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  http: ^1.2.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
