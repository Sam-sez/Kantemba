name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # This repo only tracks pubspec.yaml + lib/ (see .gitignore) — the
      # native android/ folder is generated fresh on every build, since it's
      # boilerplate Flutter can regenerate and doesn't need to live in git.
      - name: Generate Android platform folder
        run: flutter create --platforms=android --org com.kantemba .

      # mobile_scanner needs camera access, and the barcode name lookup
      # needs internet access — inject both permissions into the freshly
      # generated manifest before building.
      - name: Add permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (split per architecture)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK (arm64 — covers virtually all modern phones)
        uses: actions/upload-artifact@v4
        with:
          name: kantemba-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload APK (armeabi-v7a — for older/budget phones)
        uses: actions/upload-artifact@v4
        with:
          name: kantemba-apk-older-phones
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
