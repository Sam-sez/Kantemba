name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # This repo only tracks pubspec.yaml + lib/ (see .gitignore) â€” the
      # native android/ folder is generated fresh on every build, since it's
      # boilerplate Flutter can regenerate and doesn't need to live in git.
      - name: Generate Android platform folder
        run: flutter create --platforms=android --org com.kantemba .

      # mobile_scanner needs camera access, and the barcode name lookup
      # needs internet access â€” inject both permissions into the freshly
      # generated manifest before building.
      - name: Add permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      # Attempt 4: ML Kit barcode classes get stripped by R8 in release builds
      # (debug works, release throws genericError / getClass() NPE). Keep them.
      # Replaces the old "disable R8" sed step, which never matched anything.
      - name: Add R8 keep rules for ML Kit / CameraX (release fix)
        run: |
          cat > android/app/proguard-rules.pro <<'EOF'
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_** { *; }
          -keep class androidx.camera.** { *; }
          -keep class dev.steenbakker.mobile_scanner.** { *; }
          -keep class com.baseflow.permissionhandler.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.internal.mlkit_**
          -dontwarn androidx.camera.**
          EOF
          sed -i 's/^          //' android/app/proguard-rules.pro
          F=android/app/build.gradle.kts
          test -f "$F" || { echo "ERROR: $F not found"; exit 1; }
          sed -i '/signingConfig = signingConfigs.getByName("debug")/a\            isMinifyEnabled = true\n            isShrinkResources = false\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")' "$F"
          grep -q 'proguardFiles' "$F" || { echo "ERROR: patch did not apply"; cat "$F"; exit 1; }
          echo "=== patched build.gradle.kts ==="; cat "$F"
          echo "=== proguard-rules.pro ==="; cat android/app/proguard-rules.pro

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (split per architecture)
        run: flutter build apk --release --split-per-abi --dart-define=BUILD_ID=run${{ github.run_number }}

      # Attempt 3: also build a DEBUG apk (R8 does not run in debug) so we can tell
      # whether the scanner failure is release-only or a plugin/toolchain problem.
      - name: Build debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=BUILD_ID=run${{ github.run_number }}-debug

      - name: Diagnostics - versions and permissions in built APK
        run: |
          echo "=== flutter ==="; flutter --version
          echo "=== plugin versions (pubspec.lock) ==="
          grep -A8 -E "^  (mobile_scanner|permission_handler):" pubspec.lock || true
          echo "=== sdk levels ==="
          grep -rnE "compileSdk|minSdk|targetSdk|ndkVersion" android/app/build.gradle* android/build.gradle* 2>/dev/null || true
          echo "=== generated manifest ==="
          cat android/app/src/main/AndroidManifest.xml
          echo "=== R8 ran? (mapping file exists only if minified) ==="
          ls -la build/app/outputs/mapping/release/ 2>&1 || echo "NO mapping dir -> R8 did NOT run"
          echo "=== permissions in release APKs ==="
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          for APK in build/app/outputs/flutter-apk/*-release.apk; do
            echo "--- $APK ---"
            "$AAPT2" dump permissions "$APK" | tee perms.txt
            grep -q "android.permission.CAMERA" perms.txt || { echo "MISSING: CAMERA in $APK"; exit 1; }
          done

      - name: Upload DEBUG APK (arm64, for isolating the camera bug)
        uses: actions/upload-artifact@v4
        with:
          name: kantemba-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload APK (arm64 â€” covers virtually all modern phones)
        uses: actions/upload-artifact@v4
        with:
          name: kantemba-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload APK (armeabi-v7a â€” for older/budget phones)
        uses: actions/upload-artifact@v4
        with:
          name: kantemba-apk-older-phones
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30